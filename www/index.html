<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساباتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--card:#fff;--tx:#10201E;--mut:#5F7270;--ac:#0B6E64;--in:#0B7A4B;--out:#B4332B;--ln:#D9E2E0;--warn:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1514;--card:#172321;--tx:#E6F0EE;--mut:#8FA5A2;--ac:#3FC1B0;--in:#4CC38A;--out:#F08A80;--ln:#263634;--warn:#E7B24F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1514;--card:#172321;--tx:#E6F0EE;--mut:#8FA5A2;--ac:#3FC1B0;--in:#4CC38A;--out:#F08A80;--ln:#263634;--warn:#E7B24F;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;padding-bottom:84px;max-width:560px;margin-inline:auto}
main{padding:14px}
h2{font-size:18px;margin:18px 0 8px}h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hero{background:var(--ac);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero small{opacity:.85}.hero b{display:block;font-size:34px;font-weight:800;margin:2px 0 8px}
.hero .two{display:flex;gap:18px}.hero .two div{flex:1}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}.warn{color:var(--warn)}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.dng{color:var(--out)}
.acts{display:flex;gap:8px;margin-bottom:12px}.acts button{flex:1;font-weight:600}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:4px;font-size:16px}
textarea{min-height:140px;direction:ltr}
.tx{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.tx:last-child{border:0}.tx b{font-weight:600}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;inset-inline:0;max-width:560px;margin-inline:auto;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 2px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:800;box-shadow:inset 0 -3px 0 var(--ac)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}#m.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sheet .row button{flex:1}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;position:relative}
.donut:after{content:"";position:absolute;inset:34px;background:var(--card);border-radius:50%}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.cols span{display:inline-block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lock input{width:200px;text-align:center}
#toast{position:fixed;bottom:96px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;display:none;z-index:30}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters input,.filters select{margin:0}

body{background:var(--bg);-webkit-tap-highlight-color:transparent}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(16,32,30,.07)}
.hero{background:linear-gradient(135deg,#0B6E64,#0F8F80);border-radius:20px;box-shadow:0 6px 16px rgba(11,110,100,.25)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#0F4F48,#0B6E64);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#0F4F48,#0B6E64);color:#fff}}
button{transition:transform .08s,opacity .15s}button:active{transform:scale(.97);opacity:.85}
button.pri{box-shadow:0 2px 6px rgba(11,110,100,.25)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
nav{box-shadow:0 -2px 10px rgba(0,0,0,.06)}
nav button{padding:8px 2px 9px;line-height:1.35}nav button span{display:block;font-size:19px}
nav button.on{box-shadow:none;background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:12px;margin:4px 2px}
.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.tx b.in,.tx b.out,.hero b,.row b{font-variant-numeric:tabular-nums}
.tx:active{background:color-mix(in srgb,var(--ac) 8%,transparent)}
h2{color:var(--tx);font-weight:800}
#toast button{margin-inline-start:8px;padding:3px 10px;background:transparent;color:inherit;border:1px solid currentColor}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--ln);color:var(--mut)}
.catrow{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.catrow span{flex:1}.catrow button{padding:5px 10px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="m"></div>
<div id="lock"><h2>حساباتي</h2><input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري"><button class="pri" onclick="unlock()">فتح</button></div>
<div id="toast"></div>
<script>
const K='hesabati_v1';
let OUT=['أكل','مواصلات','فواتير','سكن','صحة','تعليم','ترفيه','ملابس','اشتراكات','أقساط','جمعية','ديون','ادخار','أخرى'];
let INC=['مرتب','شغل حر','هدية','ديون','أخرى'];
const DEF_OUT=OUT.slice(),DEF_INC=INC.slice(),PROT=['ادخار','ديون','أخرى'],SKIP=['ادخار','ديون'];
const sp=t=>t.type=='out'&&!SKIP.includes(t.cat);
const COL=['#0B6E64','#C2410C','#7C3AED','#B7791F','#2563EB','#BE185D','#4D7C0F','#0E7490','#9333EA','#B91C1C','#64748B','#D97706','#059669','#475569'];
let S,tab='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const id=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const td=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ym=d=>d.slice(0,7);
const f=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج.م';
const hasPin=()=>!!(S.pin||S.pinh);
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hesabati|'+p));return 'h:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+p}}
function fixState(){const d={acc:[],tx:[],bud:{},goals:[],debts:[],rec:[],theme:'auto',pin:'',pinh:'',rem:['14:00','21:00'],lastBackup:0,lockAfter:60};
if(!S||typeof S!='object')S={};
for(const k in d)if(S[k]==null)S[k]=JSON.parse(JSON.stringify(d[k]));
['acc','tx','goals','debts','rec','rem'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
if(typeof S.bud!='object'||Array.isArray(S.bud))S.bud={};
if(!S.acc.length)S.acc=[{id:'a1',name:'كاش',open:0},{id:'a2',name:'بنك',open:0}];
if(!S.cats||!Array.isArray(S.cats.out)||!Array.isArray(S.cats.inc))S.cats={out:DEF_OUT.slice(),inc:DEF_INC.slice()};
PROT.forEach(c=>{if(!S.cats.out.includes(c))S.cats.out.push(c)});if(!S.cats.inc.includes('أخرى'))S.cats.inc.push('أخرى');if(!S.cats.inc.includes('ديون'))S.cats.inc.push('ديون');
OUT=S.cats.out;INC=S.cats.inc;
S.tx.forEach(t=>{if(t.ref)return;if(t.type=='out'&&t.cat=='ادخار'){const g=S.goals.find(x=>x.name==t.note);if(g)t.ref={k:'g',id:g.id}}
else if(t.cat=='ديون'&&(t.type=='in'||t.type=='out')){const dir=t.type=='in'?'له':'عليا';const q=S.debts.find(x=>x.dir==dir&&(x.kind+' - '+x.who)==t.note);if(q)t.ref={k:'d',id:q.id}}})}
function adjRef(r,dl){if(!r)return;if(r.k=='g'){const g=S.goals.find(x=>x.id==r.id);if(g)g.saved=Math.max(0,g.saved+dl)}else{const d=S.debts.find(x=>x.id==r.id);if(d)d.paid=Math.max(0,d.paid+dl)}}
function dropLinked(k,i){const l=S.tx.filter(t=>t.ref&&t.ref.k==k&&t.ref.id==i);S.tx=S.tx.filter(t=>!(t.ref&&t.ref.k==k&&t.ref.id==i));if(l.length)toast('اتمسح '+l.length+' عملية مرتبطة ورجعت الفلوس للحساب')}
function exportData(){return JSON.stringify(S,(k,v)=>(k=='pin'||k=='pinh')?undefined:v)}
function applyBackup(x){if(!x||typeof x!='object'||!Array.isArray(x.acc)||!Array.isArray(x.tx))throw 0;x.pin=S.pin||'';x.pinh=S.pinh||'';S=x;fixState();save();theme();render()}
let IMGS=new Set();
function scanImgs(){IMGS=new Set();try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('hesabati_img_'))IMGS.add(k.slice(13))}}catch(e){}}
function cleanImgs(){try{IMGS.forEach(i=>{if(!S.tx.some(t=>t.id==i)){localStorage.removeItem('hesabati_img_'+i);IMGS.delete(i)}})}catch(e){}}
function setImg(i,d){try{if(d){localStorage.setItem('hesabati_img_'+i,d);IMGS.add(i)}else{localStorage.removeItem('hesabati_img_'+i);IMGS.delete(i)}}catch(e){toast('المساحة ممتلئة، الصورة ماتحفظتش')}}
function showImg(src){const p=$('#imgp');if(!p)return;p.innerHTML=src?`<img src="${src}" style="max-width:100%;max-height:200px;border-radius:10px;margin:6px 0;display:block"><button onclick="window._pi=null;showImg('')">إزالة الصورة</button>`:''}
function pickImg(inp){const f=inp.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);window._pi=c.toDataURL('image/jpeg',.6);URL.revokeObjectURL(u);showImg(window._pi)};im.onerror=()=>toast('الصورة مش مقروءة');im.src=u}
function imgUI(t){const row=document.querySelector('#m .sheet .row');if(!row)return;const b=document.createElement('div');b.style.marginBottom='10px';b.innerHTML='<div class="mut">إيصال (اختياري)</div><label class="chip" style="cursor:pointer;margin-top:4px;padding:6px 12px">📎 إرفاق صورة<input type="file" accept="image/*" style="display:none" onchange="pickImg(this)"></label><div id="imgp"></div>';row.parentNode.insertBefore(b,row);
if(t&&IMGS.has(t.id)){try{showImg(localStorage.getItem('hesabati_img_'+t.id))}catch(e){}}}
function lockNow(){$('#lock').style.display='flex'}
async function unlock(){const v=$('#pin').value;let ok=false;if(S.pinh)ok=(await hp(v))==S.pinh;else if(S.pin)ok=v==S.pin;if(ok){$('#lock').style.display='none';$('#pin').value=''}else toast('الرقم غلط')}
function setupResume(){document.addEventListener('visibilitychange',()=>{if(document.hidden){window._hid=Date.now();return}
if(hasPin()&&S.lockAfter>=0&&window._hid&&Date.now()-window._hid>S.lockAfter*1000)lockNow();applyRec();sched();render()})}
function load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}
return{acc:[{id:'a1',name:'كاش',open:0},{id:'a2',name:'بنك',open:0}],tx:[],bud:{},goals:[],debts:[],rec:[],theme:'auto',pin:''}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!window._se){window._se=1;toast('تعذر الحفظ، ممكن المساحة ممتلئة. خد نسخة احتياطية')}}clearTimeout(window._st);window._st=setTimeout(sched,1500)}
function toast(t,fn){const e=$('#toast');e.innerHTML=esc(t)+(fn?'<button id="und">تراجع</button>':'');e.style.display='block';if(fn)$('#und').onclick=()=>{fn();e.style.display='none'};clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',fn?7000:2200)}
function bal(a){let b=+a.open||0;S.tx.forEach(t=>{if(t.type=='in'&&t.acc==a.id)b+=t.amt;if(t.type=='out'&&t.acc==a.id)b-=t.amt;if(t.type=='tr'){if(t.acc==a.id)b-=t.amt;if(t.to==a.id)b+=t.amt}});return b}
const accName=i=>(S.acc.find(a=>a.id==i)||{name:'-'}).name;
const accOpts=()=>S.acc.map(a=>[a.id,a.name]);
function sum(type,m,cat){return S.tx.filter(t=>t.type==type&&(!m||ym(t.date)==m)&&(cat?t.cat==cat:!SKIP.includes(t.cat))).reduce((s,t)=>s+t.amt,0)}

function applyRec(){const now=td(),cur=ym(now);let ch=false;
S.rec.forEach(r=>{let [y,m]=r.last.split('-').map(Number);
while(true){m++;if(m>12){m=1;y++}const k=y+'-'+pad(m);if(k>cur)break;
const d=k+'-'+pad(Math.min(r.day,new Date(y,m,0).getDate()));if(d>now)break;
S.tx.push({id:id(),type:r.type,amt:r.amt,date:d,cat:r.cat,acc:r.acc,note:r.note+' (تلقائي)'});r.last=k;ch=true}});
if(ch)save()}

function form(title,fields,onSave,onDel){const m=$('#m');
m.innerHTML=`<div class="sheet"><h3>${title}</h3>${fields.map(x=>`<label>${x.l}${x.t=='select'?`<select id="f_${x.k}">${x.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==x.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:x.t=='area'?`<textarea id="f_${x.k}">${esc(x.v)}</textarea>`:`<input id="f_${x.k}" type="${x.t||'text'}" ${x.t=='number'?'inputmode="decimal" step="any"':''} value="${esc(x.v)}">`}</label>`).join('')}<div class="row">${onSave?'<button class="pri" id="ok">حفظ</button>':''}${onDel?'<button class="dng" id="dl">حذف</button>':''}<button id="cx">إغلاق</button></div></div>`;
m.classList.add('on');
const close=()=>m.classList.remove('on');
$('#cx').onclick=close;
if(onSave)$('#ok').onclick=()=>{const o={};fields.forEach(x=>{const v=$('#f_'+x.k).value;o[x.k]=x.t=='number'?(parseFloat(v)||0):v});if(onSave(o)!==false){close();save();render()}};
if(onDel)$('#dl').onclick=()=>{if(confirm('تأكيد الحذف؟')){const snap=JSON.stringify(S);onDel();close();save();render();toast('اتمسح',()=>{S=JSON.parse(snap);fixState();save();render()})}}}

function txForm(type,t){window._pi=undefined;const isTr=type=='tr',cats=type=='in'?INC:OUT;
const fs=[{k:'amt',l:'المبلغ',t:'number',v:t?t.amt:''},{k:'date',l:'التاريخ',t:'date',v:t?t.date:td()}];
if(!isTr)fs.push({k:'cat',l:type=='in'?'المصدر':'الفئة',t:'select',o:cats.map(c=>[c,c]),v:t?t.cat:cats[0]});
fs.push({k:'acc',l:isTr?'من حساب':'الحساب',t:'select',o:accOpts(),v:t?t.acc:S.acc[0].id});
if(isTr)fs.push({k:'to',l:'إلى حساب',t:'select',o:accOpts(),v:t?t.to:(S.acc[1]||S.acc[0]).id});
fs.push({k:'note',l:'ملاحظة',v:t?t.note:''});
const title=(t?'تعديل ':'')+(type=='in'?'دخل':type=='out'?'مصروف':'تحويل');
form(title,fs,o=>{if(o.amt<=0){toast('اكتب المبلغ');return false}
if(isTr&&o.acc==o.to){toast('اختار حسابين مختلفين');return false}
const nid=t?t.id:id();if(t){if(t.ref){adjRef(t.ref,o.amt-t.amt);o.cat=t.cat}Object.assign(t,o)}else{S.tx.push({id:nid,type,...o});S.lastLog=Date.now()}if(window._pi!==undefined)setImg(nid,window._pi)},t?()=>{if(t.ref)adjRef(t.ref,-t.amt);S.tx=S.tx.filter(x=>x.id!=t.id)}:null);imgUI(t)}
const editTx=i=>{const t=S.tx.find(x=>x.id==i);txForm(t.type,t)};

function bud(){const m=ym(td());return Object.entries(S.bud).filter(([c,v])=>v>0).map(([c,v])=>({c,v,s:sum('out',m,c)}))}
function txRow(t){const sg=t.type=='in'?'+':t.type=='out'?'-':'';const cl=t.type=='in'?'in':t.type=='out'?'out':'mut';
return `<div class="tx" onclick="editTx('${t.id}')"><div><b>${esc(t.type=='tr'?'تحويل':t.cat)}</b><div class="mut">${t.date} · ${esc(accName(t.acc))}${t.type=='tr'?' ← '+esc(accName(t.to)):''}${t.note?' · '+esc(t.note):''}${IMGS.has(t.id)?' · 📎':''}</div></div><b class="${cl}">${sg}${f(t.amt)}</b></div>`}

const V={
home(){const m=ym(td()),tot=S.acc.reduce((s,a)=>s+bal(a),0),i=sum('in',m),o=sum('out',m);
const al=bud().filter(b=>b.s>=b.v*.8).map(b=>`<div class="card ${b.s>b.v?'out':'warn'}">${b.s>b.v?'تعديت':'قربت تعدي'} ميزانية ${esc(b.c)}: ${f(b.s)} من ${f(b.v)}</div>`).join('');
const d=new Date().getDate(),rm=S.rec.filter(r=>r.last!=m&&r.day-d>=0&&r.day-d<=3).map(r=>`<div class="card warn">قريب: ${esc(r.note||r.cat)} ${f(r.amt)} يوم ${r.day}</div>`).join('');
const dd=S.debts.filter(x=>x.due&&x.due<=td()&&x.paid<x.amt).map(x=>`<div class="card warn">مستحق: ${esc(x.kind)} ${esc(x.who)}</div>`).join('');
const dn=new Date(),dmn=dn.getDate(),dim=new Date(dn.getFullYear(),dn.getMonth()+1,0).getDate(),pt=sum('out',pmo(m)),sv=sum('out',m,'ادخار'),dp=sum('out',m,'ديون');
const lb=S.lastBackup||0,bd=Math.floor((Date.now()-lb)/864e5);
const bk=S.tx.length&&(!lb||bd>=7)?`<div class="card warn row sp"><span>${lb?'بقالك '+bd+' يوم من غير نسخة احتياطية':'لسه ماخدتش نسخة احتياطية'}</span><button onclick="backup()">خد نسخة</button></div>`:'';
let ex='';if(o>0&&dmn>=3&&dmn<dim)ex+=`<div class="mut">بالمعدل ده هتصرف حوالي <b>${f(o/dmn*dim)}</b> آخر الشهر</div>`;
if(pt>0&&o>0){const df=o-pt;ex+=`<div class="mut">${df>0?'أكتر':'أقل'} من الشهر اللي فات بـ ${f(Math.abs(df))}</div>`}
if(sv>0||dp>0)ex+=`<div class="mut">ادخار الشهر: ${f(sv)} · سداد ديون: ${f(dp)} (مش محسوبين مصروف)</div>`;
if(ex)ex=`<div class="card">${ex}</div>`;
return `<div class="hero"><small>رصيدك الحالي</small><b>${f(tot)}</b><div class="two"><div><small>دخل الشهر</small><br>${f(i)}</div><div><small>مصروف الشهر</small><br>${f(o)}</div></div></div>
<div class="acts"><button class="pri" onclick="txForm('out')">+ مصروف</button><button class="pri" onclick="txForm('in')">+ دخل</button><button onclick="txForm('tr')">تحويل</button></div>${bk}${al}${rm}${dd}${ex}
<h2>الحسابات</h2><div class="card">${S.acc.map(a=>`<div class="row sp" style="padding:6px 0"><span>${esc(a.name)}</span><b>${f(bal(a))}</b></div>`).join('')}</div>

function restore(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';
i.onchange=()=>{const fl=i.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.acc||!x.tx)throw 0;if(!confirm('الاسترجاع هيستبدل كل البيانات الحالية. تكمل؟'))return;applyBackup(x);toast('تم الاسترجاع')}catch(e){toast('الملف مش صحيح')}};r.onerror=()=>toast('تعذر قراءة الملف');r.readAsText(fl)};i.click()}
function csvText(){const r=[['التاريخ','النوع','الفئة','المبلغ','الحساب','ملاحظة']].concat(S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type=='in'?'دخل':t.type=='out'?'مصروف':'تحويل',t.cat||'',t.amt,accName(t.acc),t.note||'']));return r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')}
function csv(){form('انسخ والصق في Excel',[{k:'c',l:'CSV',t:'area',v:csvText()}],null);const t=$('#f_c');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('اتنسخ'))}catch(e){}}
async function csvFile(){try{await shareFile('hesabati-'+td()+'.csv','\ufeff'+csvText(),'text/csv','تصدير حساباتي');toast('تم تجهيز الملف')}catch(e){if(/cancel/i.test(String(e&&(e.message||e))))return;toast('تعذر حفظ الملف، استخدم Excel كنص');csv()}}
function pinForm(){form('الرقم السري',[{k:'p',l:'رقم جديد، 4 أرقام على الأقل (فاضي للإلغاء)',t:'password',v:''}],o=>{const p=(o.p||'').trim();if(p&&p.length<4){toast('4 أرقام على الأقل');return false}
if(!p){S.pin='';S.pinh='';toast('تم الإلغاء');return}hp(p).then(h=>{S.pinh=h;S.pin='';save();render()});toast('تم التفعيل')})}
function catMgr(){const mm=$('#m');const sec=(k,t)=>`<h3 style="margin-top:12px">${t}</h3>`+S.cats[k].map(c=>`<div class="catrow"><span>${esc(c)}</span>${PROT.includes(c)?'<span class="chip" style="flex:none">أساسية</span>':`<button onclick="catForm('${k}',${esc(JSON.stringify(c)).replace(/&quot;/g,'&quot;')})">تعديل</button>`}</div>`).join('')+`<button style="width:100%;margin-top:8px" onclick="catForm('${k}')">+ فئة جديدة</button>`;
mm.innerHTML=`<div class="sheet"><h3>إدارة الفئات</h3>${sec('out','فئات المصروف')}${sec('inc','فئات الدخل')}<button style="width:100%;margin-top:14px" id="cx">إغلاق</button></div>`;mm.classList.add('on');$('#cx').onclick=()=>mm.classList.remove('on')}
function catForm(k,old){const ty=k=='out'?'out':'in';form(old?'تعديل فئة':'فئة جديدة',[{k:'n',l:'الاسم',v:old||''}],o=>{const n=(o.n||'').trim();if(!n){toast('اكتب الاسم');return false}const l=S.cats[k];if(l.includes(n)&&n!=old){toast('الفئة موجودة');return false}
if(old){l[l.indexOf(old)]=n;S.tx.forEach(t=>{if(t.type==ty&&t.cat==old)t.cat=n});S.rec.forEach(r=>{if(r.type==ty&&r.cat==old)r.cat=n});if(k=='out'&&S.bud[old]!=null){S.bud[n]=S.bud[old];delete S.bud[old]}}
else{const at=l.indexOf('أخرى');l.splice(at>=0?at:l.length,0,n)}setTimeout(catMgr,50)},old&&!PROT.includes(old)?()=>{const l=S.cats[k];S.cats[k]=l.filter(c=>c!=old);OUT=S.cats.out;INC=S.cats.inc;S.tx.forEach(t=>{if(t.type==ty&&t.cat==old)t.cat='أخرى'});S.rec.forEach(r=>{if(r.type==ty&&r.cat==old)r.cat='أخرى'});if(k=='out')delete S.bud[old];setTimeout(catMgr,50)}:null)}
const LN=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
async function sched(){const L=LN();if(!L)return;try{const p=await L.requestPermissions();if(p.display!=='granted')return;
const pe=await L.getPending();if(pe.notifications.length)await L.cancel({notifications:pe.notifications});
const now=Date.now(),list=[];
for(let d=0;d<30;d++)(S.rem||[]).forEach((tm,k)=>{const [h,mi]=tm.split(':').map(Number);const at=new Date();at.setDate(at.getDate()+d);at.setHours(h,mi,0,0);
if(at.getTime()<=now)return;if(d==0&&S.lastLog&&S.lastLog>=at.getTime()-7200000)return;
list.push({id:d*10+k+1,title:'حساباتي',body:'صرفت حاجة؟ سجّلها دلوقتي.',schedule:{at,allowWhileIdle:true},actionTypeId:'LOG'})});
if(list.length)await L.schedule({notifications:list})}catch(e){}}
function remForm(){const r=S.rem||[];form('أوقات التذكير (سيب الخانة فاضية لإلغائها)',[0,1,2].map(i=>({k:'t'+i,l:'الوقت '+(i+1),t:'time',v:r[i]||''})),o=>{S.rem=[o.t0,o.t1,o.t2].filter(Boolean)})}
async function testN(){const L=LN();if(!L){toast('الإشعارات شغالة في تطبيق الأندرويد بس');return}try{const p=await L.requestPermissions();if(p.display!=='granted'){toast('فعّل الإشعارات من إعدادات الموبايل');return}
await L.schedule({notifications:[{id:9999,title:'حساباتي',body:'ده إشعار تجريبي. صرفت حاجة؟ سجّلها.',schedule:{at:new Date(Date.now()+4000)},actionTypeId:'LOG'}]});toast('هيجيلك إشعار كمان ثواني')}catch(e){toast('حصل خطأ في الإشعارات')}}
async function initN(){const L=LN();if(!L)return;try{await L.registerActionTypes({types:[{id:'LOG',actions:[{id:'add',title:'تسجيل مصروف'}]}]});
L.addListener('localNotificationActionPerformed',()=>{tab='home';render();txForm('out')});sched()}catch(e){}}
S=load();fixState();scanImgs();cleanImgs();theme();applyRec();render();if(S.pin)hp(S.pin).then(h=>{S.pinh=h;S.pin='';save()});if(hasPin())lockNow();initN();setupResume();
</script>
