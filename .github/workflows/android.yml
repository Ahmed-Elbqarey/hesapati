name: Build APK
on:
  release:
    types: [published]
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add notification permissions
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>#' $F
      - name: Use fixed debug keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/hesabati.keystore"
          test -s "$GITHUB_WORKSPACE/hesabati.keystore"
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("GITHUB_WORKSPACE") + "/hesabati.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hesabati-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "hesabati-${{ github.event.release.tag_name }}.apk"
          gh release upload "${{ github.event.release.tag_name }}" "hesabati-${{ github.event.release.tag_name }}.apk" --clobber --repo "${{ github.repository }}"
